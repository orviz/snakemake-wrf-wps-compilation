---

wrf_version: "4.6.1"
wps_version: "4.6.0"

wps_install_dir: "software/WPS"
wrf_install_dir: "software/WRF"

compiler: "intel"

installation_engine: "easybuild"

easybuild:
  toolchain_suffix: "-foss-2024a-dmpar"
  wps_subdir: "software/WPS/{wps_version}{toolchain_suffix}/WPS-{wps_version}"
  wrf_subdir: "software/WRF/{wrf_version}{toolchain_suffix}/WRFV{wrf_version}"

eessi_init_script: "/cvmfs/software.eessi.io/versions/2025.06/init/bash"